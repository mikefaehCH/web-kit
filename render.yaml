services:
  - type: web
    name: web-kit-admin
    runtime: static
    buildCommand: echo "Static admin assets"
    staticPublishPath: ./admin
    autoDeployTrigger: off
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Cache-Control
        value: no-store
