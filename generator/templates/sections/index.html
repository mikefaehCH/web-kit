<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#965a3e" />
    <meta name="description" content="Allgemeine Infoseite" />
    <title>Infoseite</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script type="module" src="./app.js"></script>
  </head>
  <body class="info-page">
    <a class="skip" href="#main">Zum Inhalt</a>
    <header>
      <h1 id="title"></h1>
      <p id="description"></p>
      <nav id="section-navigation" aria-label="Abschnitte" hidden></nav>
    </header>
    <main id="main">
      <div id="sections"></div>
      <section id="planner" aria-labelledby="planner-heading" tabindex="-1" hidden>
        <h2 id="planner-heading">Mein Planer</h2>
        <form>
          <fieldset disabled>
            <legend id="planner-editor-label">Idee oder Aufgabe</legend>
            <label>Titel <input name="title" maxlength="140" required /></label>
            <label>Art
              <select name="kind">
                <option value="idea">Idee</option>
                <option value="task">Aufgabe</option>
              </select>
            </label>
            <div class="planner-actions">
              <button id="planner-save" type="submit">Eintrag erfassen</button>
              <button id="planner-cancel" type="button" hidden>Bearbeitung abbrechen</button>
            </div>
          </fieldset>
        </form>
        <p id="planner-status" role="status"></p>
        <fieldset disabled>
          <legend>Einträge</legend>
          <label hidden>Suche
            <input id="planner-search" type="search" placeholder="Titel, Kategorie oder Notiz" />
          </label>
          <label><span id="planner-filter-label">Filter</span>
            <select id="planner-filter">
              <option value="all">Alle</option>
              <option value="open">Offen</option>
              <option value="done">Erledigt</option>
            </select>
          </label>
          <p id="planner-empty">Hier erscheinen deine Einträge.</p>
          <ul id="planner-list"></ul>
        </fieldset>
        <details>
          <summary>Daten und Backup</summary>
          <p>Deine Einträge liegen in diesem Browserprofil auf diesem Gerät. Für einen Gerätewechsel exportiere ein Backup und importiere es in dieselbe App.</p>
          <fieldset disabled>
            <legend>Backup</legend>
            <button id="planner-export" type="button">Backup herunterladen</button>
            <label>Backup wiederherstellen <input id="planner-import" type="file" accept=".json,application/json" /></label>
          </fieldset>
        </details>
      </section>
      <p id="offline-status" role="status"></p>
    </main>
  </body>
</html>
