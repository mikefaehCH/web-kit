name: Publish web-kit wizard
on:
  pull_request:
    branches: [main]
    paths:
      - "generator/**"
      - ".github/ISSUE_TEMPLATE/web-kit-site-request.yml"
      - ".github/workflows/publish-generator-pages.yml"
  push:
    branches: [main]
    paths:
      - "generator/**"
      - ".github/ISSUE_TEMPLATE/web-kit-site-request.yml"
      - ".github/workflows/publish-generator-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Test generator and issue handoff
        run: |
          npm --prefix generator test
          node --test generator/tests/publish-config.mjs
      - name: Build static Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R generator/. _site/
          touch _site/.nojekyll
          test -s _site/admin/index.html
          test -s _site/admin/bootstrap.js
          test -s _site/admin/wizard.js
          test -s _site/modules/site-generator.js
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
