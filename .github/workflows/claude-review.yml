name: Claude review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

# This workflow is loaded from the trusted base branch. It never checks out or
# executes pull-request code; the diff is fetched as untrusted text by the runner.
permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review (trusted runner)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Review exact PR diff and publish commit status
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_REVIEW_ENABLED: ${{ vars.CLAUDE_REVIEW_ENABLED }}
          CLAUDE_REVIEW_BUDGET_APPROVED: ${{ vars.CLAUDE_REVIEW_BUDGET_APPROVED }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          CLAUDE_MODEL: claude-sonnet-5
        run: python3 scripts/run_claude_review.py
