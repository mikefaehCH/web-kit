name: Claude review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

# This workflow is loaded from the trusted base branch. It never checks out or
# executes pull-request code; the diff is fetched as untrusted text by the runner.
# Enforcement must require the `Claude review` check from the dedicated GitHub
# App as its expected source; a name-only status requirement is insufficient.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review (trusted runner)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Create repository-scoped check-run token
        id: review-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CLAUDE_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: web-kit
          permission-checks: write

      - name: Review exact PR diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_REVIEW_ENABLED: ${{ vars.CLAUDE_REVIEW_ENABLED }}
          CLAUDE_REVIEW_BUDGET_APPROVED: ${{ vars.CLAUDE_REVIEW_BUDGET_APPROVED }}
          GH_TOKEN: ${{ github.token }}
          CHECKS_TOKEN: ${{ steps.review-app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          CLAUDE_MODEL: claude-sonnet-5
        run: python3 scripts/run_claude_review.py
