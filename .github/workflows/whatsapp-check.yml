name: WhatsApp admin checks
on:
  pull_request:
  push:
    branches: [feat/admin-whatsapp-composer]
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify pinned local Supabase bundle
        run: |
          npm ci --prefix admin --ignore-scripts
          npm run --prefix admin build:vendor
          git diff --exit-code -- admin/vendor/supabase.js
          node admin/build-static.mjs
          node --input-type=module -e "import{readdirSync}from'node:fs';const f=readdirSync('admin/dist').sort();if(f.join(',')!=='auth.js,vendor,whatsapp.css,whatsapp.html,whatsapp.js'||readdirSync('admin/dist/vendor').sort().join(',')!=='LICENSES.txt,supabase.js')process.exit(1)"
      - run: node --check admin/whatsapp.js
      - run: node --test tests/whatsapp-static.mjs

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verhaltenstests (ohne Netzwerk, ohne echten Versand)
        run: node --experimental-strip-types --test tests/edge-handler.test.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck wie in Supabase (Deno)
        run: deno check supabase/functions/web-kit-whatsapp-send/index.ts

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webkit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: webkit_test
    steps:
      - uses: actions/checkout@v4
      - name: Migrationen + Rechte-, Missbrauchs- und Parallelitätstests
        run: supabase/tests/run.sh
