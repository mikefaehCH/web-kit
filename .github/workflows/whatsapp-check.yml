name: WhatsApp admin checks
on:
  pull_request:
  push:
    branches: [feat/admin-whatsapp-composer]
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check admin/whatsapp.js
      - run: node --test tests/whatsapp-static.mjs

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verhaltenstests (ohne Netzwerk, ohne echten Versand)
        run: node --experimental-strip-types --test tests/edge-handler.test.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck wie in Supabase (Deno)
        run: deno check supabase/functions/web-kit-whatsapp-send/index.ts

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webkit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: webkit_test
    steps:
      - uses: actions/checkout@v4
      - name: Migrationen + Rechte-, Missbrauchs- und Parallelitätstests
        run: supabase/tests/run.sh
