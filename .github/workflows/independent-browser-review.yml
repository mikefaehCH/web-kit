name: Independent browser review
on:
  pull_request:
    paths:
      - '.github/workflows/independent-browser-review.yml'
      - 'tests/independent-browser-review.cjs'
permissions:
  contents: read
jobs:
  cross-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mikefaehCH/edinburgh
          ref: 1c7107e986d7bbf1adbd84afbbf6ed8d1c13addc
          path: edinburgh-base
      - uses: actions/checkout@v4
        with:
          repository: mikefaehCH/edinburgh
          ref: 7a6c4ba7b8821ef5bb1ac8b277f35f97f2c808a3
          path: edinburgh-head
      - uses: actions/checkout@v4
        with:
          repository: mikefaehCH/Valencia
          ref: ba90b22e507a00dfde1eab252f56a75cbfd500fe
          path: valencia-base
      - uses: actions/checkout@v4
        with:
          repository: mikefaehCH/Valencia
          ref: 209e5632dba17c3ec5bded1b426a5fa2475c7c73
          path: valencia-head
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: mkdir -p screenshots && node tests/independent-browser-review.cjs
      - name: Check Valencia production at 390 px
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const b=await chromium.launch();
            const p=await b.newPage({viewport:{width:390,height:900}});
            const r=await p.goto('https://mikefaehch.github.io/Valencia/',{waitUntil:'domcontentloaded'});
            assert.equal(r.status(),200);
            assert.equal(await p.locator('main').count(),1);
            assert.equal(await p.locator('h2.section-label').count(),3);
            assert.equal(await p.locator('h1').innerText(),'Tipps von Pablo');
            const g=await p.evaluate(()=>[document.documentElement.scrollWidth,document.documentElement.clientWidth]);
            assert.ok(g[0]<=g[1],JSON.stringify(g));
            console.log('LIVE PASS Valencia HTTP 200, main, headings, 390px, no horizontal overflow');
            const e=await p.goto('https://mikefaehch.github.io/edinburgh/',{waitUntil:'domcontentloaded'});
            assert.equal(e.status(),200);
            assert.ok((await p.locator('h1').innerText()).includes('Edinburgh'));
            assert.equal(await p.evaluate(()=>getComputedStyle(document.documentElement).getPropertyValue('--muted').trim()),'#59665f');
            const eg=await p.evaluate(()=>[document.documentElement.scrollWidth,document.documentElement.clientWidth]);
            assert.ok(eg[0]<=eg[1],JSON.stringify(eg));
            console.log('LIVE PASS Edinburgh HTTP 200, expected colour, 390px, no horizontal overflow');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edinburgh-screenshots
          path: screenshots/*.png
