name: Private ledger security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ledger_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test policies and optimistic concurrency in empty database
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00-supabase-stub.sql
          sed 's/829dfa95-6722-4b08-aa1b-843e38a06ba7/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/g' supabase/pending/20261103144722_private_travel_ledgers.sql | psql -X -v ON_ERROR_STOP=1
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/private-ledger-ci.sql
      - name: Concurrent snapshot integration test
        run: bash supabase/tests/private-ledger-concurrency.sh
