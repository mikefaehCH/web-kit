name: Autonomous merge
on:
  workflow_run:
    workflows: ["Web-kit quality", "WhatsApp admin checks"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  guarded-merge:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify authorized opt-in PR and immutable HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for pr in $(gh api "repos/$GH_REPO/commits/$RUN_SHA/pulls" --jq '.[] | select(.state=="open") | .number'); do
            gh api "repos/$GH_REPO/pulls/$pr" > pr.json
            jq -e --arg sha "$RUN_SHA" '
              .state=="open" and (.draft|not) and .base.ref=="main" and
              .head.sha==$sha and .head.repo.full_name==.base.repo.full_name and
              (.body // "" | test("(?m)^Autonomy-Release: true$"))
            ' pr.json >/dev/null || continue

            # GitHub's merge API enforces the repository's configured required
            # checks and reviews. Never override them or use an admin bypass.
            # Fail closed: until a reviewed path classifier exists, only an
            # added or modified README may use the unattended merge path.
            # Other PRs continue through normal reviewed GitHub merging.
            gh api --paginate --slurp "repos/$GH_REPO/pulls/$pr/files?per_page=100" > files.json
            jq -e 'flatten | length > 0 and all(.[]; .filename == "README.md" and (.status == "added" or .status == "modified"))' files.json >/dev/null || continue

            # A pending change request is not automatically dismissed.
            gh api --paginate --slurp "repos/$GH_REPO/pulls/$pr/reviews?per_page=100" > reviews.json
            jq -e '[flatten | .[] | select(.user.login != null) | {login: .user.login, state: .state}] | group_by(.login) | all(.[]; (last.state != "CHANGES_REQUESTED"))' reviews.json >/dev/null || continue
            gh api -X PUT "repos/$GH_REPO/pulls/$pr/merge" \
              -f merge_method=squash -f sha="$RUN_SHA" >/dev/null
          done
