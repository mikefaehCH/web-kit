name: Web-kit quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository baseline
        run: |
          git diff --check
          test -s README.md
          test -s AGENTS.md
          test -s RELEASE_POLICY.md
          test -f .github/workflows/autonomous-merge.yml
          test -s generator/VERSION.json
      - name: Test Claude review verdict validator
        run: python3 -m unittest discover -s tests -p 'test_claude_*'
      - name: Test release merge guard
        run: python3 -m unittest discover -s tests -p 'test_release_guard.py'
      - name: Node.js 22 (pinned)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test versioned generator and CLI demo end to end
        run: npm --prefix generator test
      - name: Install browser test tools
        run: |
          npm --prefix generator/tests/browser ci --ignore-scripts
          generator/tests/browser/node_modules/.bin/playwright-core install chromium --only-shell
      - name: Test app preview, storage, backup and offline mode in Chromium
        run: node generator/tests/browser/planner.mjs
