<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web-Kit · WhatsApp</title><link rel="stylesheet" href="./whatsapp.css"></head>
<body><main class="panel"><p class="eyebrow">Web-Kit · Admin</p><h1>WhatsApp-Nachricht</h1><p>Manueller Versand an die Camino-Gruppe.</p>
<form id="composer"><label for="recipient">Empfänger</label><input id="recipient" value="Camino" readonly>
<label for="message">Nachricht</label><textarea id="message" rows="7" maxlength="4000" required placeholder="Deine Nachricht an die Gruppe …"></textarea>
<div class="counter"><output id="count">0</output> / 4000 Zeichen</div>
<button id="send" type="submit" disabled>Nachricht prüfen</button></form>
<section id="review" hidden aria-labelledby="review-title"><h2 id="review-title">Versand bestätigen</h2><p>Empfänger: <strong>Camino</strong></p><pre id="preview"></pre><div class="actions"><button id="confirm" type="button">Jetzt senden</button><button id="cancel" type="button" class="secondary">Abbrechen</button></div></section>
<p id="status" role="status" aria-live="polite"></p>
<p class="hint">Der Versand erfordert einen geschützten, für Administratoren freigegebenen Server-Endpunkt. Zugangsdaten gehören niemals in den Browser.</p></main>
<script type="module" src="./whatsapp.js"></script></body></html>
